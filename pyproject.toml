[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-builder"
version = "0.1.0"
description = "Local Markdown-to-PDF CV builder using Pandoc and XeLaTeX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cv-builder = "cv_builder.cli:main"
cv-builder-web = "cv_builder.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_builder = ["static/*"]
