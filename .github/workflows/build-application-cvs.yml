name: Build application CVs

on:
  push:
    paths:
      - "applications/**/cv.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed CVs
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_file="${RUNNER_TEMP}/changed-cvs"
          : > "$changed_file"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              git diff-tree --no-commit-id --name-only -r --diff-filter=AM -z \
                "$HEAD_SHA" -- 'applications/**/cv.md' > "$changed_file"
            else
              git diff-tree --root --no-commit-id --name-only -r --diff-filter=AM -z \
                "$HEAD_SHA" -- 'applications/**/cv.md' > "$changed_file"
            fi
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AM -z \
              "$BEFORE_SHA" "$HEAD_SHA" -- 'applications/**/cv.md' > "$changed_file"
          else
            git ls-tree -r --name-only -z "$HEAD_SHA" -- applications \
              | while IFS= read -r -d '' path; do
                  [[ "$path" == */cv.md ]] && printf '%s\0' "$path"
                done > "$changed_file"
          fi

          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
          done < "$changed_file"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Install PDF dependencies
        if: steps.changes.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-texgyre \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Validate and build changed CVs
        if: steps.changes.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            output="${source%/*}/cv.pdf"
            echo "Building ${source} -> ${output}"
            PYTHONPATH=src python3 -m cv_builder \
              --project-root "$GITHUB_WORKSPACE" \
              --input "$source" \
              --output "$output"
          done < "${RUNNER_TEMP}/changed-cvs"

      - name: Upload generated PDFs
        if: steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: application-cvs-${{ github.run_id }}-${{ github.run_attempt }}
          path: applications/**/cv.pdf
          if-no-files-found: error
